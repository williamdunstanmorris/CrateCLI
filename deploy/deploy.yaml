apiVersion: apps/v1
kind: Deployment
metadata:
  name: crate
  namespace: crate
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: crate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: crate }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: crate }
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: crate
          image: 479592483600.dkr.ecr.eu-central-1.amazonaws.com/crate:c462cda
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: crate
  namespace: crate
spec:
  selector: { app.kubernetes.io/name: crate }
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crate
  namespace: crate
  annotations:
    alb.ingress.kubernetes.io/group.name: shared
    alb.ingress.kubernetes.io/load-balancer-name: shared-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
spec:
  ingressClassName: alb
  rules:
    - host: crate.subcloudlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: crate, port: { number: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crate
  namespace: crate
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: crate }
